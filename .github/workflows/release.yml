name: Release APK

# Every push to main that touches the app builds a signed release APK and
# publishes it as its own versioned GitHub release (v0.1.N, marked Latest).
# The tag equals the app's versionName, so Obtainium can track the repo with
# its default settings.
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.LAZY9_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::LAZY9_KEYSTORE_B64 secret is missing — refusing to publish an APK signed with a throwaway key"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lazy9.jks"

      - name: Assemble release APK
        env:
          LAZY9_KEYSTORE_PASSWORD: ${{ secrets.LAZY9_KEYSTORE_PASSWORD }}
          LAZY9_KEY_ALIAS: lazy9
        run: |
          export LAZY9_KEYSTORE="$RUNNER_TEMP/lazy9.jks"
          export ANDROID_VERSION_CODE="$GITHUB_RUN_NUMBER"
          export ANDROID_VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "lazy9-0.1.${GITHUB_RUN_NUMBER}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Lazy9 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: lazy9-0.1.${{ github.run_number }}.apk

      # Keep only the newest few releases (and their tags).
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("v0."))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r tag; do
              [ -n "$tag" ] && gh release delete "$tag" --yes --cleanup-tag
            done
